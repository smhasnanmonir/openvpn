name: Desktop CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test, vet, build, package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: true
          cache-dependency-path: desktop/go.sum

      - name: Install native UI runtime headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -count=1

      - name: Build
        run: go build ./...

      - name: Cross-compile the GUI and helper
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...

      - name: Package with MyGo
        run: go tool mygo build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-amd64
          path: |
            desktop/build/linux-amd64/openvpn-desktop
            desktop/build/linux-amd64/openvpn-desktop-1.0.0-linux-amd64.tar.gz
            desktop/build/linux-amd64/openvpn-desktop_1.0.0_amd64.deb
          if-no-files-found: error

  # The live tunnel test is intentionally not a CI job: it needs root,
  # /dev/net/tun and two network namespaces. Run it manually with
  #   sudo desktop/scripts/test-live-tunnel.sh
  # It is documented in desktop/docs/testing.md.
