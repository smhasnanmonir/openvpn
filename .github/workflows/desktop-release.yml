name: Desktop release

on:
  push:
    branches: ["feat/desktop-production"]
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the desktop-v prefix"
        required: true
        default: "1.0.0"

permissions:
  contents: write
  actions: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.x"
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.version != '' && format('desktop-v{0}', inputs.version) || 'desktop-v1.0.0') }}
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.version != '' && format('desktop-v{0}', inputs.version) || 'desktop-v1.0.0') }}

jobs:
  linux:
    name: Linux packages and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true
          cache-dependency-path: desktop/go.sum
      - name: Install native UI runtime headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev
      - name: Set release version
        run: python3 scripts/set-version.py "$TAG"
      - name: Require update signing key for a tag
        if: github.ref_type == 'tag'
        run: test -n "$MYGO_UPDATER_PRIVATE_KEY" || { echo "::error::set MYGO_UPDATER_PRIVATE_KEY"; exit 1; }
      - name: Vet and test (race)
        run: |
          go vet ./...
          go test -race ./... -count=1
          go build ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Build bundled helpers and SBOM
        run: |
          ./scripts/build-helpers.sh
          python3 scripts/gen-sbom.py -o build/sbom.cdx.json
      - name: Build Linux packages
        run: go tool mygo build -platform linux/amd64,linux/arm64
      - name: Verify packages carry the helper
        run: |
          set -e
          for deb in build/linux-*/*.deb; do
            dpkg-deb -c "$deb" | grep -F 'openvpn-desktop-helper' >/dev/null
          done
          for tar in build/linux-*/*.tar.gz; do
            tar tzf "$tar" | grep -F 'openvpn-desktop-helper' >/dev/null
          done
          if [[ -n "${MYGO_UPDATER_PRIVATE_KEY:-}" ]]; then
            test -f build/linux-amd64/update-linux-amd64.json
            test -f build/linux-arm64/update-linux-arm64.json
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: |
            desktop/build/linux-amd64
            desktop/build/linux-arm64
            desktop/build/sbom.cdx.json
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      MYGO_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
      SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG || 'windows-app' }}
      SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG || 'windows-installer' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true
          cache-dependency-path: desktop/go.sum
      - name: Set release version
        run: |
          python3 scripts/set-version.py "$TAG"
          echo "RELEASE_VERSION=${TAG#desktop-v}" >> "$GITHUB_ENV"
      - name: Require release signing credentials for a tag
        if: github.ref_type == 'tag'
        run: |
          test -n "$MYGO_UPDATER_PRIVATE_KEY" || { echo "::error::set MYGO_UPDATER_PRIVATE_KEY"; exit 1; }
          if [[ -n "$SIGNPATH_API_TOKEN" ]]; then
            for name in SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_SIGNING_POLICY_SLUG; do
              test -n "${!name}" || { echo "::error::set $name"; exit 1; }
            done
          elif [[ -n "$WINDOWS_CERT_PFX_BASE64" ]]; then
            test -n "$MYGO_WINDOWS_CERTIFICATE_PASSWORD" || { echo "::error::set WINDOWS_CERT_PASSWORD"; exit 1; }
          else
            echo "::error::set SignPath credentials or WINDOWS_CERT_PFX_BASE64"
            exit 1
          fi
      - name: Check the SignPath configuration
        if: env.SIGNPATH_API_TOKEN != ''
        run: |
          for name in SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_SIGNING_POLICY_SLUG; do
            test -n "${!name}" || { echo "::error::set $name"; exit 1; }
          done
      - name: Import the local Authenticode certificate
        if: env.SIGNPATH_API_TOKEN == '' && env.WINDOWS_CERT_PFX_BASE64 != ''
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib
          pathlib.Path("packaging").mkdir(exist_ok=True)
          pathlib.Path("packaging/windows.pfx").write_bytes(base64.b64decode(os.environ["WINDOWS_CERT_PFX_BASE64"]))
          cfg = json.loads(pathlib.Path("mygo.json").read_text())
          cfg.setdefault("windows", {})["certificate"] = "packaging/windows.pfx"
          pathlib.Path("mygo.json").write_text(json.dumps(cfg, indent=2, ensure_ascii=False) + "\n")
          PY
      - name: Vet, test and build
        run: |
          go vet ./...
          go test ./... -count=1
          go build ./...
      - name: Build bundled helpers
        run: ./scripts/build-helpers.sh
      - name: Validate the Windows installer script
        shell: pwsh
        working-directory: desktop
        run: |
          $errors = $null
          foreach ($script in @("scripts/install-windows-service.ps1", "packaging/signpath-inject.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$null, [ref]$errors
            ) | Out-Null
            if ($errors) { $errors; exit 1 }
          }
      - name: Validate the SignPath signing configuration
        run: python3 scripts/check-signing-config.py

      - name: Build the staging installer for SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        run: |
          set -euo pipefail
          cp mygo.json "$RUNNER_TEMP/mygo.json.release"
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path("mygo.json")
          cfg = json.loads(path.read_text())
          windows = cfg.setdefault("windows", {})
          windows["installerInclude"] = "packaging/installer-staging.nsh"
          windows.pop("certificate", None)
          windows.pop("signCommand", None)
          path.write_text(json.dumps(cfg, indent=2, ensure_ascii=False) + "\n")
          PY
          go tool mygo build -platform windows/amd64

      - name: Extract the staging uninstaller
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        working-directory: desktop
        run: |
          $ErrorActionPreference = "Stop"
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\OpenVPN Desktop"
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          $setup = Get-ChildItem "build/windows-amd64/*-setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "staging installer not found" }
          $install = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "staging installer failed: $($install.ExitCode)" }
          $uninstaller = Join-Path $installDir "Uninstall.exe"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $uninstaller); $i++) {
            Start-Sleep -Milliseconds 500
          }
          if (-not (Test-Path $uninstaller)) { throw "staging installer did not write Uninstall.exe" }
          $staging = Join-Path $env:RUNNER_TEMP "signpath-staging"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item $uninstaller (Join-Path $staging "Uninstall.exe") -Force
          Copy-Item "build/windows-amd64/OpenVPN Desktop.exe" $staging -Force
          Copy-Item "build/windows-amd64/openvpn-desktop-helper.exe" $staging -Force
          Remove-Item -Recurse -Force $installDir
          Remove-Item "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\OpenVPN Desktop.lnk" -Force -ErrorAction SilentlyContinue
          Remove-Item "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\com.smhasnanmonir.openvpndesktop" -Recurse -Force -ErrorAction SilentlyContinue
          $upload = Join-Path $env:GITHUB_WORKSPACE "desktop/signpath-app"
          Remove-Item -Recurse -Force $upload -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $upload | Out-Null
          Copy-Item (Join-Path $staging "*") $upload -Force

      - name: Upload the unsigned app files for SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        id: upload-unsigned-app
        uses: actions/upload-artifact@v7
        with:
          name: windows-app-unsigned
          path: desktop/signpath-app
          if-no-files-found: error

      - name: Sign app, helper and uninstaller with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: desktop/signed-app

      - name: Install the signed app files and verify
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        working-directory: desktop
        run: |
          $ErrorActionPreference = "Stop"
          $signed = Join-Path $env:RUNNER_TEMP "signpath-signed"
          New-Item -ItemType Directory -Force $signed | Out-Null
          $root = Join-Path $env:GITHUB_WORKSPACE "desktop/signed-app"
          $files = Get-ChildItem $root -Recurse -File
          foreach ($name in @("OpenVPN Desktop.exe", "openvpn-desktop-helper.exe", "Uninstall.exe")) {
            $f = $files | Where-Object Name -eq $name | Select-Object -First 1
            if (-not $f) { throw "SignPath did not return $name" }
            Copy-Item $f.FullName (Join-Path $signed $name) -Force
          }
          foreach ($name in @("OpenVPN Desktop.exe", "openvpn-desktop-helper.exe", "Uninstall.exe")) {
            $path = Join-Path $signed $name
            $sig = Get-AuthenticodeSignature $path
            if ($sig.Status -eq "NotSigned") { throw "$name is unsigned" }
            if (-not $sig.SignerCertificate -or $sig.SignerCertificate.Subject -notmatch "SignPath") {
              throw "$name is not signed by SignPath: $($sig.SignerCertificate.Subject)"
            }
            if ($env:SIGNPATH_SIGNING_POLICY_SLUG -ne "test-signing" -and $sig.Status -ne "Valid") {
              throw "$name is not validly signed: $($sig.Status)"
            }
          }
          "SIGNPATH_SIGNED_APP=$signed\OpenVPN Desktop.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNPATH_SIGNED_HELPER=$signed\openvpn-desktop-helper.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNPATH_SIGNED_UNINSTALLER=$signed\Uninstall.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure MyGo to inject the signed files
        if: env.SIGNPATH_API_TOKEN != ''
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/mygo.json.release" mygo.json
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path("mygo.json")
          cfg = json.loads(path.read_text())
          windows = cfg.setdefault("windows", {})
          windows["installerInclude"] = "packaging/installer.nsh"
          windows.pop("certificate", None)
          windows["signCommand"] = "powershell -NoProfile -ExecutionPolicy Bypass -File packaging/signpath-inject.ps1 %1"
          path.write_text(json.dumps(cfg, indent=2, ensure_ascii=False) + "\n")
          PY

      - name: Build the release installer with signed files
        if: env.SIGNPATH_API_TOKEN != ''
        run: go tool mygo build -platform windows/amd64

      - name: Verify the release app and helper signatures
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        working-directory: desktop
        run: |
          foreach ($f in @("build/windows-amd64/OpenVPN Desktop.exe", "build/windows-amd64/openvpn-desktop-helper.exe")) {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -eq "NotSigned") { throw "$f is unsigned" }
            Write-Host "$f -> $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($env:SIGNPATH_SIGNING_POLICY_SLUG -ne "test-signing" -and $sig.Status -ne "Valid") {
              throw "$f is not validly signed: $($sig.Status)"
            }
          }

      - name: Prepare the final installer for SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        working-directory: desktop
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:GITHUB_WORKSPACE "desktop/signpath-installer"
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dir | Out-Null
          $setup = Get-ChildItem "build/windows-amd64/*-setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "release installer not found" }
          Copy-Item $setup.FullName $dir -Force

      - name: Upload the unsigned installer for SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-unsigned
          path: desktop/signpath-installer
          if-no-files-found: error

      - name: Sign the installer with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: desktop/signed-installer

      - name: Install the signed installer into the build output and verify
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        working-directory: desktop
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:GITHUB_WORKSPACE "desktop/signed-installer"
          $signedSetup = Get-ChildItem $root -Recurse -File -Filter "*-setup-*.exe" | Select-Object -First 1
          if (-not $signedSetup) { throw "SignPath did not return the installer" }
          $target = Get-ChildItem "build/windows-amd64/*-setup-*.exe" | Select-Object -First 1
          Copy-Item $signedSetup.FullName $target.FullName -Force
          $sig = Get-AuthenticodeSignature $target.FullName
          if ($sig.Status -eq "NotSigned") { throw "the installer is unsigned" }
          if (-not $sig.SignerCertificate -or $sig.SignerCertificate.Subject -notmatch "SignPath") {
            throw "the installer is not signed by SignPath"
          }
          if ($env:SIGNPATH_SIGNING_POLICY_SLUG -ne "test-signing" -and $sig.Status -ne "Valid") {
            throw "the installer is not validly signed: $($sig.Status)"
          }
          Write-Host "installer -> $($sig.Status) $($sig.SignerCertificate.Subject)"

      - name: Build Windows app and installer with the local certificate
        if: env.SIGNPATH_API_TOKEN == ''
        run: go tool mygo build -platform windows/amd64
      - name: Verify the installer and bundled helper
        run: |
          set -e
          ls build/windows-amd64/*-setup-*.exe
          test -f build/windows-amd64/openvpn-desktop-helper.exe
          test -f build/windows-amd64/OpenVPN\ Desktop.exe
          if [[ -n "${MYGO_UPDATER_PRIVATE_KEY:-}" ]]; then
            test -f build/windows-amd64/update-windows-amd64.json
          fi
      - name: Smoke-test the real Windows service
        shell: pwsh
        working-directory: desktop
        run: ./scripts/test-windows-service.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: desktop/build/windows-amd64
          if-no-files-found: error

  macos:
    name: macOS app, dmg and notarization
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true
          cache-dependency-path: desktop/go.sum
      - name: Set release version
        run: python3 scripts/set-version.py "$TAG"
      - name: Require signing and notarization secrets for a tag
        if: github.ref_type == 'tag'
        run: |
          test -n "$MYGO_UPDATER_PRIVATE_KEY" || { echo "::error::set MYGO_UPDATER_PRIVATE_KEY"; exit 1; }
          test -n "$MACOS_CERT_P12_BASE64" || { echo "::error::set MACOS_CERT_P12_BASE64"; exit 1; }
          test -n "$MACOS_SIGNING_IDENTITY" || { echo "::error::set MACOS_SIGNING_IDENTITY"; exit 1; }
          test -n "$MACOS_NOTARY_APPLE_ID" || { echo "::error::set MACOS_NOTARY_APPLE_ID"; exit 1; }
          test -n "$MACOS_NOTARY_TEAM_ID" || { echo "::error::set MACOS_NOTARY_TEAM_ID"; exit 1; }
          test -n "$MACOS_NOTARY_PASSWORD" || { echo "::error::set MACOS_NOTARY_PASSWORD"; exit 1; }
      - name: Import Developer ID certificate and notary credentials
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          xcrun notarytool store-credentials openvpn-desktop \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --keychain "$KEYCHAIN"
          python3 - <<'PY'
          import json, os, pathlib
          cfg = json.loads(pathlib.Path("mygo.json").read_text())
          cfg.setdefault("macos", {})["notarize"] = {
              "keychainProfile": "openvpn-desktop",
              "keychain": os.environ["RUNNER_TEMP"] + "/app-signing.keychain-db",
          }
          pathlib.Path("mygo.json").write_text(json.dumps(cfg, indent=2, ensure_ascii=False) + "\n")
          PY
      - name: Vet, test and build
        run: |
          go vet ./...
          go test ./... -count=1
          go build ./...
      - name: Build bundled helpers
        run: ./scripts/build-helpers.sh
      - name: Build macOS app and disk image
        run: |
          ARGS=(-platform darwin/universal)
          if [[ -n "$MACOS_SIGNING_IDENTITY" ]]; then
            ARGS+=(-sign "$MACOS_SIGNING_IDENTITY")
          fi
          go tool mygo build "${ARGS[@]}"
      - name: Verify the app and bundled helper
        run: |
          set -e
          test -d "build/darwin-universal/OpenVPN Desktop.app"
          test -f "build/darwin-universal/OpenVPN Desktop.app/Contents/Resources/openvpn-desktop-helper"
          if [[ -n "${MYGO_UPDATER_PRIVATE_KEY:-}" ]]; then
            test -f build/darwin-universal/update-darwin-universal.json
          fi
          ls build/darwin-universal/*.dmg
      - name: Install OpenVPN for the service smoke test
        run: brew install openvpn && brew link --force openvpn
      - name: Smoke-test the real launchd helper
        run: sudo ./scripts/test-macos-service.sh
      - name: Remove the temporary keychain
        if: always() && env.MACOS_CERT_P12_BASE64 != ''
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos
          path: desktop/build/darwin-universal
          if-no-files-found: error

  release:
    name: Draft GitHub release
    if: github.ref_type == 'tag'
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
      - name: Assemble a deterministic asset set
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            case "$base" in
              *.tar.gz|*.deb|*.rpm|*.dmg|*-setup-*.exe|update-*.json|*.delta|install.ps1|PKGBUILD|openvpn-desktop-helper.exe|sbom.cdx.json)
                cp "$f" "release-assets/$base"
                ;;
              install.sh)
                # Linux and macOS installers differ; keep both names.
                if [[ "$f" == *"/desktop-linux/"* ]]; then
                  cp "$f" release-assets/install.sh
                else
                  cp "$f" release-assets/install-macos.sh
                fi
                ;;
            esac
          done < <(find dist -type f -print0)
          # The Linux release branch is the canonical install.sh.
          if [[ -f release-assets/install-macos.sh && ! -f release-assets/install.sh ]]; then
            mv release-assets/install-macos.sh release-assets/install.sh
          fi
          (cd release-assets && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum | sed 's#  \./#  #') > release-assets/SHA256SUMS
          python3 desktop/scripts/release-notes.py "${VERSION#desktop-v}" > notes.md
          ls -l release-assets
          cat notes.md
      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=""
            if [[ "${VERSION#desktop-v}" == *-* ]]; then
              prerelease="--prerelease"
            fi
            gh release create "$TAG" \
              --draft \
              --latest=false \
              $prerelease \
              --title "OpenVPN Desktop ${VERSION#desktop-v}" \
              --notes-file notes.md
          fi
          find release-assets -maxdepth 1 -type f -print0 | xargs -0 -r gh release upload "$TAG" --clobber
