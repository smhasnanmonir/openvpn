name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Hosted runners have no IPv6 route while services.gradle.org resolves to
      # IPv6 first. The Gradle wrapper downloads its distribution with a plain
      # HttpsURLConnection (no IPv4 fallback), which fails with "Network is
      # unreachable"; force the JVM to use IPv4 so `./gradlew` can bootstrap.
      JAVA_OPTS: "-Djava.net.preferIPv4Stack=true"
    steps:
      - name: Checkout with pinned OpenVPN Core submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Use the project wrapper instead of a CI-preinstalled Gradle so that
          # wrapper bumps (Dependabot PRs) are actually exercised by CI.
          gradle-version: "wrapper"

      - name: Verify the project Gradle wrapper is used
        run: |
          wrapper_version="$(sed -nE 's/^distributionUrl=.*gradle-([0-9.]+)-bin\.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties)"
          reported_version="$(./gradlew --no-daemon --version | sed -nE 's/^Gradle ([0-9.]+)$/\1/p' | head -n 1)"
          echo "wrapper distribution: ${wrapper_version}"
          echo "./gradlew reports:    ${reported_version}"
          if [[ -z "$wrapper_version" || "$wrapper_version" != "$reported_version" ]]; then
            echo "::error::CI is not using the project Gradle wrapper (wrapper '${wrapper_version}', reported '${reported_version}')"
            exit 1
          fi

      - name: Install pinned Android SDK packages
        timeout-minutes: 20
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --install "platform-tools" "platforms;android-37.0" \
            "build-tools;36.0.0" "build-tools;37.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Cache native dependencies
        uses: actions/cache@v6
        with:
          path: |
            .native-deps/cache
            app/src/main/cpp/deps
          key: native-deps-v1-${{ runner.os }}-${{ hashFiles('scripts/fetch-native-deps.sh', 'scripts/build-native-deps.sh', 'third_party/openvpn3/deps/asio/patches/*') }}

      - name: Build pinned native dependencies
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ./scripts/build-native-deps.sh arm64-v8a x86_64

      - name: Set version from tag or run
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="1.0.0"
          fi
          # Non-tag builds keep the workflow run number. Validate before writing
          # to GITHUB_ENV: a malformed or too-low version code must fail the job
          # instead of silently becoming the Gradle default of 1.
          APP_VERSION_CODE="${GITHUB_RUN_NUMBER}"
          if [[ -z "${APP_VERSION}" ]]; then
            echo "::error::could not derive APP_VERSION from ref ${GITHUB_REF}"
            exit 1
          fi
          if [[ ! "${APP_VERSION_CODE}" =~ ^[0-9]+$ ]] || (( APP_VERSION_CODE <= 45 )); then
            echo "::error::APP_VERSION_CODE='${APP_VERSION_CODE}' is not a valid version code: expected a positive integer greater than 45 (the v1.3.0 versionCode)"
            exit 1
          fi
          {
            echo "APP_VERSION=${APP_VERSION}"
            echo "APP_VERSION_CODE=${APP_VERSION_CODE}"
          } >> "$GITHUB_ENV"
          echo "APP_VERSION=${APP_VERSION} APP_VERSION_CODE=${APP_VERSION_CODE}"

      - name: Unit tests, lint, debug APK, instrumentation-test APK
        run: |
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest

      - name: Verify 16 KB page-size alignment and packaged ABIs
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_SDK_ROOT/ndk/27.2.12479018}"
          APK=app/build/outputs/apk/debug/app-debug.apk
          bash scripts/check-16kb-alignment.sh "$APK"
          # The default build packages both ABIs; fail if one silently disappeared.
          for abi in arm64-v8a x86_64; do
            if ! unzip -l "$APK" | grep -qE "lib/${abi}/libnativevpn\\.so"; then
              echo "::error::expected lib/${abi}/libnativevpn.so in $APK (default build packages arm64-v8a and x86_64)"
              exit 1
            fi
          done

      - name: Generate SBOM (CycloneDX)
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          # Use the project wrapper explicitly; scripts/generate-sbom.sh would
          # otherwise prefer a `gradle` command found on PATH.
          GRADLE_BIN=./gradlew bash scripts/generate-sbom.sh --output build/sbom/sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: build/sbom/sbom.cdx.json
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test APKs
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${RELEASE_KEYSTORE_BASE64}" ]]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release and gate the release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # SHA-256 of the v1.3.0 release signing certificate. A published tag
          # must be signed by this key; rotate the value together with the key.
          RELEASE_CERT_SHA256: "834d2a58261a6c4113a3170953c1eea4a30d65ebc5ba4386408f09039dd00c9c"
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_SDK_ROOT/ndk/27.2.12479018}"
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/37.0.0"

          ./gradlew --no-daemon :app:assembleRelease :app:lintRelease

          # Same 16 KB gate and ABI assertion as the debug APK: the artifact that
          # is published must not rely on debug-only checks.
          bash scripts/check-16kb-alignment.sh "$APK"
          for abi in arm64-v8a x86_64; do
            if ! unzip -l "$APK" | grep -qE "lib/${abi}/libnativevpn\\.so"; then
              echo "::error::expected lib/${abi}/libnativevpn.so in the release APK (default build packages arm64-v8a and x86_64)"
              exit 1
            fi
          done

          # Signature + certificate identity.
          #
          # apksigner formats the line differently across build-tools releases:
          #   build-tools <= 36: "Signer #1 certificate SHA-256 digest: <hex>"
          #   build-tools 37:    "V3.0 Signer: certificate SHA-256 digest: <hex>"
          # Match the field itself instead of the signer prefix so both stay
          # supported. If a signing-key rotation ever produces more than one
          # distinct digest, fail instead of guessing which key signed the APK.
          SIGNER_OUTPUT="$("${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$SIGNER_OUTPUT"
          CERT_DIGESTS="$(
            printf '%s\n' "$SIGNER_OUTPUT" \
              | sed -nE 's/.*certificate SHA-256 digest: *([0-9a-fA-F]{64}).*/\1/p' \
              | tr 'A-F' 'a-f' \
              | sort -u
          )"
          DIGEST_COUNT="$(printf '%s\n' "$CERT_DIGESTS" | grep -c . || true)"
          if [[ "${DIGEST_COUNT}" -eq 0 ]]; then
            echo "::error::could not read the release certificate SHA-256 digest from apksigner output (expected 'Signer #1 certificate SHA-256 digest:' or 'V3.0 Signer: certificate SHA-256 digest:')"
            exit 1
          fi
          if [[ "${DIGEST_COUNT}" -gt 1 ]]; then
            echo "::error::apksigner reported ${DIGEST_COUNT} distinct certificate SHA-256 digests; refusing to guess which key signed this APK:"
            printf '%s\n' "$CERT_DIGESTS"
            exit 1
          fi
          ACTUAL_CERT_SHA256="${CERT_DIGESTS}"
          if [[ "$ACTUAL_CERT_SHA256" != "$RELEASE_CERT_SHA256" ]]; then
            echo "::error::release APK certificate SHA-256 is $ACTUAL_CERT_SHA256, expected $RELEASE_CERT_SHA256 (v1.3.0 release key)"
            exit 1
          fi

          # Artifact identity: version name must match the tag exactly and the
          # version code must move forward from v1.3.0 (versionCode 45).
          BADGING="$("${BUILD_TOOLS}/aapt2" dump badging "$APK")"
          ACTUAL_VERSION_NAME="$(
            printf '%s\n' "$BADGING" \
              | sed -nE "s/.*versionName='([^']*)'.*/\1/p" \
              | head -n 1
          )"
          ACTUAL_VERSION_CODE="$(
            printf '%s\n' "$BADGING" \
              | sed -nE "s/.*versionCode='([^']*)'.*/\1/p" \
              | head -n 1
          )"
          EXPECTED_VERSION_NAME="${GITHUB_REF_NAME#v}"
          echo "Release APK identity: versionName=${ACTUAL_VERSION_NAME} versionCode=${ACTUAL_VERSION_CODE} certificateSHA256=${ACTUAL_CERT_SHA256}"
          if [[ "$ACTUAL_VERSION_NAME" != "$EXPECTED_VERSION_NAME" ]]; then
            echo "::error::release APK versionName is '$ACTUAL_VERSION_NAME' but the tag requires '$EXPECTED_VERSION_NAME'"
            exit 1
          fi
          if [[ ! "$ACTUAL_VERSION_CODE" =~ ^[0-9]+$ ]] || (( ACTUAL_VERSION_CODE <= 45 )); then
            echo "::error::release APK versionCode '$ACTUAL_VERSION_CODE' is not greater than 45 (v1.3.0 versionCode); set APP_VERSION_CODE to a higher value"
            exit 1
          fi
          if printf '%s\n' "$BADGING" | grep -q '^application-debuggable'; then
            echo "::error::release APK is debuggable (aapt2 badging reports application-debuggable)"
            exit 1
          fi

          # The SBOM is generated earlier in this job and published with the APK.
          if [[ ! -f build/sbom/sbom.cdx.json ]]; then
            echo "::error::build/sbom/sbom.cdx.json is missing; the SBOM artifact (name: sbom) would be empty"
            exit 1
          fi
          echo "SBOM present: $(wc -c < build/sbom/sbom.cdx.json) bytes"

      - name: Upload signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v8
        with:
          name: app-release
          path: release

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/app-release.apk
            release/sbom.cdx.json
          generate_release_notes: true
          fail_on_unmatched_files: true
